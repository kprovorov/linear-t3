name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Everything runs with the RELEASE_PR_TOKEN PAT, because PRs opened with
# GITHUB_TOKEN don't trigger CI. GITHUB_TOKEN itself gets no permissions.
permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
    steps:
      - name: Require RELEASE_PR_TOKEN
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The RELEASE_PR_TOKEN repo secret is not set."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(npm version "$BUMP" --no-git-tag-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/$version" >> "$GITHUB_OUTPUT"
      - name: Check only package.json changed
        run: |
          changed="$(git status --porcelain)"
          if [ "$changed" != " M package.json" ]; then
            echo "::error::Expected only package.json to change, got:"
            echo "$changed"
            exit 1
          fi
      - name: Fail if the release branch or PR already exists
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            echo "::error::Branch $BRANCH already exists."
            exit 1
          fi
          pr="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[].url')"
          if [ -n "$pr" ]; then
            echo "::error::A PR for $BRANCH already exists: $pr"
            exit 1
          fi
      - name: Commit, push and open the PR
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --all --message "release: $VERSION"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: $VERSION" \
            --body "Bumps the package version to \`$VERSION\`."
