name: Bump version

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Everything runs with the RELEASE_PR_TOKEN PAT, because PRs opened with
# GITHUB_TOKEN don't trigger CI. GITHUB_TOKEN itself gets no permissions.
permissions: {}

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require RELEASE_PR_TOKEN
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::The RELEASE_PR_TOKEN repo secret is not set."
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          # Full history and tags, to find the latest release and the commits since.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      # Commit subjects are Conventional Commits (squash-merged PR titles, see
      # pr-title.yml). A breaking change is major, a feat is minor, anything
      # else is patch. Older non-conventional commits count as patch.
      - name: Pick the bump from commits since the latest release
        id: pick
        run: |
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          current="v$(node -p 'require("./package.json").version')"
          if [ -n "$latest" ] && [ "$current" != "$latest" ]; then
            echo "::error::package.json is at $current but the latest release is $latest. Release $current before bumping again."
            exit 1
          fi
          range="${latest:+$latest..}HEAD"
          subjects="$(git log --format=%s "$range")"
          if [ -z "$subjects" ]; then
            echo "::error::No commits since $latest, so there is nothing to release."
            exit 1
          fi
          if printf '%s\n' "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!: ' \
            || git log --format=%b "$range" | grep -Eq '^BREAKING[ -]CHANGE: '; then
            bump=major
          elif printf '%s\n' "$subjects" | grep -Eq '^feat(\([^)]*\))?: '; then
            bump=minor
          else
            bump=patch
          fi
          echo "Commits since ${latest:-the first commit}:"
          printf '%s\n' "$subjects"
          echo "Bump: $bump"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ steps.pick.outputs.bump }}
        run: |
          version="$(npm version "$BUMP" --no-git-tag-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "branch=release/$version" >> "$GITHUB_OUTPUT"
      - name: Check only the version field changed
        run: |
          changed="$(git status --porcelain)"
          added="$(git diff --unified=0 | grep '^+ ' || true)"
          if [ "$changed" != " M package.json" ] \
            || [ "$(git diff --numstat)" != "$(printf '1\t1\tpackage.json')" ] \
            || ! printf '%s' "$added" | grep -q '^+ *"version": '; then
            echo "::error::Expected only the version field in package.json to change, got:"
            git status --short
            git diff
            exit 1
          fi
      # An open PR always has its head branch, so checking the branch also
      # catches an existing release PR.
      - name: Fail if the release branch already exists
        env:
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          status=0
          git ls-remote --exit-code origin "refs/heads/$BRANCH" > /dev/null || status=$?
          case "$status" in
            0)
              echo "::error::Branch $BRANCH already exists, so a release PR for it may already be open."
              exit 1
              ;;
            2) ;;
            *)
              echo "::error::Could not check whether $BRANCH exists (git ls-remote exited $status)."
              exit 1
              ;;
          esac
      - name: Commit, push and open the PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --all --message "release: $VERSION"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "release: $VERSION" \
            --body "Bumps the package version to \`$VERSION\`."
