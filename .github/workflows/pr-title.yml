name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # PR titles become the squash commit subjects that "Bump version" reads, so
  # they must be Conventional Commits: `type(scope)!: description`, where the
  # scope and `!` (breaking change) are optional.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style|release)(\([^)]+\))?!?: [^ ]'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title \"$TITLE\" is not a Conventional Commit. Use \"type(scope): description\", e.g. \"feat(WF-15): bump version from commit history\". Add \"!\" after the type or scope for a breaking change. Types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert, style, release."
            exit 1
          fi
